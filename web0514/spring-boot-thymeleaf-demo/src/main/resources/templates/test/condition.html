<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>条件判断演示</title>
    <div th:replace="~{common/header :: common-css}"></div>
    <style>
        body { max-width: 800px; margin: 50px auto; padding: 0 20px; }
        .section { margin: 30px 0; padding: 20px; border: 1px solid #eee; border-radius: 8px; }
        h2 { color: #2c3e50; border-bottom: 2px solid #3498db; padding-bottom: 10px; }
        .admin { color: #e74c3c; font-weight: bold; }
    </style>
</head>
<body>
    <div th:replace="~{common/header :: common-header}"></div>
    
    <div class="container">
        <h1>Thymeleaf 条件判断演示</h1>

        <!-- 1. th:if 条件判断 -->
        <div class="section">
            <h2>1. th:if 条件判断</h2>
            <p th:if="${isAdmin}" class="admin">✅ 您是管理员，拥有所有权限</p>
            <p th:if="${!isAdmin}">❌ 您是普通用户，只有查看权限</p>
        </div>

        <!-- 2. th:unless 条件判断（th:if的反向） -->
        <div class="section">
            <h2>2. th:unless 条件判断</h2>
            <p th:unless="${#lists.isEmpty(emptyList)}">列表有数据</p>
            <p th:if="${#lists.isEmpty(emptyList)}">列表为空</p>
        </div>

        <!-- 3. 多条件判断 -->
        <div class="section">
            <h2>3. 多条件判断</h2>
            <p th:if="${score >= 90}">优秀</p>
            <p th:if="${score >= 80 and score < 90}">良好</p>
            <p th:if="${score >= 60 and score < 80}">及格</p>
            <p th:if="${score < 60}">不及格</p>
        </div>

        <!-- 4. th:switch / th:case 多分支判断 -->
        <div class="section">
            <h2>4. th:switch / th:case 多分支判断</h2>
            <div th:switch="${status}">
                <p th:case="'active'">✅ 账号状态：正常</p>
                <p th:case="'banned'">❌ 账号状态：已封禁</p>
                <p th:case="'pending'">⏳ 账号状态：待审核</p>
                <p th:case="*">❓ 账号状态：未知</p>
            </div>
        </div>
    </div>
    
    <div th:replace="~{common/footer :: common-footer}"></div>
    <div th:replace="~{common/footer :: footer-css}"></div>
</body>
</html>
