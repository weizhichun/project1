<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>注册 - 在线商城</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Microsoft YaHei', sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .login-box { background: white; padding: 40px; border-radius: 12px; box-shadow: 0 10px 40px rgba(0,0,0,0.2); width: 400px; }
        .login-box h2 { text-align: center; margin-bottom: 30px; color: #333; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; color: #666; }
        .form-group input { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 6px; font-size: 14px; }
        .btn { width: 100%; padding: 12px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 16px; }
        .btn:hover { opacity: 0.9; }
        .link { text-align: center; margin-top: 20px; }
        .link a { color: #667eea; text-decoration: none; }
        .message { padding: 12px; border-radius: 6px; margin-bottom: 20px; display: none; }
        .message.success { background: #d4edda; color: #155724; }
        .message.error { background: #f8d7da; color: #721c24; }
    </style>
</head>
<body>
<div class="login-box">
    <h2>用户注册</h2>
    <div class="message" id="message"></div>
    <div class="form-group">
        <label>用户名</label>
        <input type="text" id="username" placeholder="请输入用户名">
    </div>
    <div class="form-group">
        <label>昵称</label>
        <input type="text" id="nickname" placeholder="请输入昵称">
    </div>
    <div class="form-group">
        <label>密码</label>
        <input type="password" id="password" placeholder="请输入密码">
    </div>
    <div class="form-group">
        <label>确认密码</label>
        <input type="password" id="confirmPassword" placeholder="请再次输入密码">
    </div>
    <button class="btn" onclick="register()">注册</button>
    <div class="link">
        已有账号？<a href="/login">立即登录</a>
    </div>
</div>
<script>
    function showMessage(success, msg) {
        const el = document.getElementById('message');
        el.style.display = 'block';
        el.className = 'message ' + (success ? 'success' : 'error');
        el.textContent = msg;
    }
    function register() {
        const username = document.getElementById('username').value;
        const nickname = document.getElementById('nickname').value;
        const password = document.getElementById('password').value;
        const confirmPassword = document.getElementById('confirmPassword').value;
        if (!username || !password) {
            showMessage(false, '请填写用户名和密码');
            return;
        }
        if (password !== confirmPassword) {
            showMessage(false, '两次密码不一致');
            return;
        }
        fetch('/web/user/register', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, password, nickname })
        })
        .then(r => r.json())
        .then(data => {
            if (data.code === 200) {
                showMessage(true, '注册成功，即将跳转...');
                setTimeout(() => location.href = '/login', 1000);
            } else {
                showMessage(false, data.msg);
            }
        });
    }
</script>
</body>
</html>
