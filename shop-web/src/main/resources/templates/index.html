<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>首页 - 在线商城</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Microsoft YaHei', sans-serif; background: #f5f5f5; }
        .header { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 0 20px; }
        .header-inner { max-width: 1200px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; height: 60px; }
        .logo { font-size: 24px; font-weight: bold; }
        .nav { display: flex; gap: 30px; }
        .nav a { color: white; text-decoration: none; font-size: 16px; opacity: 0.9; }
        .nav a:hover { opacity: 1; }
        .user-info { display: flex; align-items: center; gap: 15px; }
        .user-info a { color: white; text-decoration: none; }
        .user-info button { padding: 6px 16px; background: rgba(255,255,255,0.2); border: none; color: white; border-radius: 4px; cursor: pointer; }
        .container { max-width: 1200px; margin: 30px auto; padding: 0 20px; }
        .search-bar { margin-bottom: 30px; display: flex; gap: 10px; }
        .search-bar input { flex: 1; padding: 12px 20px; border: 1px solid #ddd; border-radius: 6px; font-size: 14px; }
        .search-bar button { padding: 0 30px; background: #667eea; color: white; border: none; border-radius: 6px; cursor: pointer; }
        .debug-bar { background: #fff3cd; padding: 15px; margin-bottom: 20px; border-radius: 6px; border: 1px solid #ffc107; }
        .debug-bar a { color: #856404; margin-right: 15px; }
        .product-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
        .product-card { background: white; border-radius: 8px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.1); transition: transform 0.3s; }
        .product-card:hover { transform: translateY(-5px); }
        .product-image { height: 200px; background: #f0f0f0; display: flex; align-items: center; justify-content: center; font-size: 60px; }
        .product-info { padding: 15px; }
        .product-name { font-size: 16px; color: #333; margin-bottom: 10px; font-weight: 500; }
        .product-price { font-size: 20px; color: #e74c3c; font-weight: bold; margin-bottom: 10px; }
        .product-stock { color: #999; font-size: 12px; margin-bottom: 10px; }
        .product-btn { width: 100%; padding: 10px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; border: none; border-radius: 4px; cursor: pointer; }
        .product-btn:hover { opacity: 0.9; }
        .footer { background: #333; color: #999; text-align: center; padding: 30px 0; margin-top: 50px; }
        .pagination { display: flex; justify-content: center; gap: 10px; margin-top: 30px; }
        .pagination button { padding: 8px 16px; border: 1px solid #ddd; background: white; cursor: pointer; border-radius: 4px; }
        .pagination button.active { background: #667eea; color: white; border-color: #667eea; }
        .message { position: fixed; top: 80px; left: 50%; transform: translateX(-50%); padding: 12px 24px; border-radius: 6px; display: none; z-index: 1000; }
        .message.success { background: #d4edda; color: #155724; }
        .message.error { background: #f8d7da; color: #721c24; }
        .loading { text-align: center; padding: 50px; color: #666; }
    </style>
</head>
<body>
<div class="header">
    <div class="header-inner">
        <div class="logo">🛒 在线商城</div>
        <div class="nav">
            <a href="/">首页</a>
            <a href="/cart">购物车</a>
            <a href="/orders">我的订单</a>
            <a href="/test" style="background: rgba(255,255,255,0.2); padding: 5px 10px; border-radius: 4px;">诊断</a>
        </div>
        <div class="user-info" id="userInfo">
            <a href="/login" id="loginLink">登录</a>
            <a href="/register" id="registerLink">注册</a>
        </div>
    </div>
</div>
<div class="container">
    <div class="debug-bar">
        <strong>🔧 调试工具：</strong>
        <a href="/debug/count" target="_blank">商品统计</a>
        <a href="/debug/products" target="_blank">所有商品</a>
        <a href="/debug/products/on" target="_blank">上架商品</a>
        <a href="/test" target="_blank">诊断页面</a>
        <span id="debugInfo" style="margin-left: 20px;"></span>
    </div>
    
    <div class="message" id="message"></div>
    <div class="search-bar">
        <input type="text" id="keyword" placeholder="搜索商品">
        <button onclick="search()">搜索</button>
        <button onclick="loadProducts(1)" style="background: #28a745;">刷新商品</button>
    </div>
    <div class="product-list" id="productList">
        <div class="loading">正在加载商品...</div>
    </div>
    <div class="pagination" id="pagination"></div>
</div>
<div class="footer">
    <p>© 2024 在线商城 - 在线购物平台</p>
</div>
<script>
    let currentPage = 1;
    let currentKeyword = '';
    
    console.log('=== 首页脚本已加载 ===');
    
    function showMessage(success, msg) {
        const el = document.getElementById('message');
        el.style.display = 'block';
        el.className = 'message ' + (success ? 'success' : 'error');
        el.textContent = msg;
        setTimeout(() => el.style.display = 'none', 3000);
    }
    
    function updateDebugInfo(text) {
        document.getElementById('debugInfo').textContent = text;
    }
    
    function loadProducts(page, keyword) {
        console.log('loadProducts 被调用, page=' + page + ', keyword=' + keyword);
        currentPage = page;
        currentKeyword = keyword || '';
        
        let url = '/web/product/page?pageNum=' + page + '&pageSize=8';
        if (keyword) url += '&keyword=' + encodeURIComponent(keyword);
        
        console.log('请求URL:', url);
        
        fetch(url)
            .then(r => {
                console.log('收到响应, status=' + r.status);
                if (!r.ok) throw new Error('网络错误: ' + r.status);
                return r.json();
            })
            .then(data => {
                console.log('商品数据:', data);
                if (data.code === 200) {
                    const records = data.data.records || [];
                    const total = data.data.total || 0;
                    updateDebugInfo('共 ' + total + ' 个商品，当前显示 ' + records.length + ' 个');
                    renderProducts(records);
                    renderPagination(data.data.current, data.data.pages);
                } else {
                    console.error('接口返回错误:', data);
                    showMessage(false, data.msg || '加载失败');
                    renderProducts([]);
                }
            })
            .catch(err => {
                console.error('加载错误:', err);
                showMessage(false, '加载商品失败: ' + err.message);
                renderProducts([]);
            });
    }
    
    function renderProducts(products) {
        console.log('renderProducts 被调用, 商品数量=' + (products ? products.length : 0));
        const container = document.getElementById('productList');
        
        if (!products || products.length === 0) {
            container.innerHTML = `
                <div style="text-align:center;color:#999;padding:50px;">
                    <h3>暂无商品</h3>
                    <p>请先访问 <a href="/test">诊断页面</a> 检查数据</p>
                </div>
            `;
            return;
        }
        
        container.innerHTML = products.map(p => `
            <div class="product-card">
                <div class="product-image">${p.mainImage ? '<img src="'+p.mainImage+'" style="width:100%;height:100%;object-fit:cover;">' : '📦'}</div>
                <div class="product-info">
                    <div class="product-name">${p.productName}</div>
                    <div class="product-price">¥${p.price}</div>
                    <div class="product-stock">库存：${p.stock} | 状态：${p.status === 1 ? '上架' : '下架'}</div>
                    <button class="product-btn" onclick="addToCart(${p.id})">加入购物车</button>
                </div>
            </div>
        `).join('');
    }
    
    function renderPagination(current, total) {
        const container = document.getElementById('pagination');
        let html = '';
        for (let i = 1; i <= total; i++) {
            html += `<button class="${i === current ? 'active' : ''}" onclick="loadProducts(${i}, currentKeyword)">${i}</button>`;
        }
        container.innerHTML = html;
    }
    
    function search() {
        loadProducts(1, document.getElementById('keyword').value);
    }
    
    function addToCart(productId) {
        fetch('/web/user/session')
            .then(r => r.json())
            .then(data => {
                if (data.code !== 200) {
                    location.href = '/login';
                    return;
                }
                fetch('/web/cart/add', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ productId, quantity: 1 })
                })
                .then(r => r.json())
                .then(d => {
                    if (d.code === 200) {
                        showMessage(true, d.msg);
                    } else {
                        showMessage(false, d.msg);
                    }
                });
            });
    }
    
    console.log('开始加载商品...');
    loadProducts(1);
    
    fetch('/web/user/session')
        .then(r => r.json())
        .then(data => {
            if (data.code === 200 && data.data) {
                document.getElementById('userInfo').innerHTML =
                    '<span>欢迎，' + data.data.nickname + '</span>' +
                    '<a href="/profile">个人中心</a>' +
                    '<button onclick="logout()">退出</button>';
                document.getElementById('loginLink').style.display = 'none';
                document.getElementById('registerLink').style.display = 'none';
            }
        });
    
    function logout() {
        fetch('/web/user/logout', { method: 'POST' })
            .then(() => location.reload());
    }
</script>
</body>
</html>
