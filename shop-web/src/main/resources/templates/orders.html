<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>我的订单 - 在线商城</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Microsoft YaHei', sans-serif; background: #f5f5f5; }
        .header { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 0 20px; }
        .header-inner { max-width: 1200px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; height: 60px; }
        .logo { font-size: 24px; font-weight: bold; }
        .nav { display: flex; gap: 30px; }
        .nav a { color: white; text-decoration: none; font-size: 16px; opacity: 0.9; }
        .nav a:hover { opacity: 1; }
        .user-info { display: flex; align-items: center; gap: 15px; }
        .user-info a { color: white; text-decoration: none; }
        .user-info button { padding: 6px 16px; background: rgba(255,255,255,0.2); border: none; color: white; border-radius: 4px; cursor: pointer; }
        .container { max-width: 1200px; margin: 30px auto; padding: 0 20px; }
        .page-title { font-size: 24px; margin-bottom: 20px; color: #333; }
        .order-list { display: flex; flex-direction: column; gap: 20px; }
        .order-card { background: white; border-radius: 8px; overflow: hidden; }
        .order-header { background: #f9f9f9; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #eee; }
        .order-no { color: #666; }
        .order-status { padding: 4px 12px; border-radius: 4px; font-size: 14px; }
        .order-status.pending { background: #fff3cd; color: #856404; }
        .order-status.paid { background: #d1ecf1; color: #0c5460; }
        .order-status.shipped { background: #d4edda; color: #155724; }
        .order-status.completed { background: #e2e3e5; color: #383d41; }
        .order-items { padding: 20px; }
        .order-item { display: flex; gap: 15px; padding: 10px 0; border-bottom: 1px solid #eee; }
        .order-item:last-child { border-bottom: none; }
        .item-image { width: 80px; height: 80px; background: #f0f0f0; display: flex; align-items: center; justify-content: center; font-size: 30px; border-radius: 4px; }
        .item-info { flex: 1; }
        .item-name { font-size: 14px; color: #333; margin-bottom: 5px; }
        .item-price { color: #666; }
        .order-footer { padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; border-top: 1px solid #eee; }
        .order-total { font-size: 16px; }
        .order-total span { color: #e74c3c; font-size: 20px; font-weight: bold; }
        .order-btn { padding: 8px 20px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; border: none; border-radius: 4px; cursor: pointer; }
        .footer { background: #333; color: #999; text-align: center; padding: 30px 0; margin-top: 50px; }
        .empty { text-align: center; padding: 80px; color: #999; }
        .message { position: fixed; top: 80px; left: 50%; transform: translateX(-50%); padding: 12px 24px; border-radius: 6px; display: none; z-index: 1000; }
        .message.success { background: #d4edda; color: #155724; }
        .message.error { background: #f8d7da; color: #721c24; }
        .pagination { display: flex; justify-content: center; gap: 10px; margin-top: 30px; }
        .pagination button { padding: 8px 16px; border: 1px solid #ddd; background: white; cursor: pointer; border-radius: 4px; }
        .pagination button.active { background: #667eea; color: white; border-color: #667eea; }
    </style>
</head>
<body>
<div class="header">
    <div class="header-inner">
        <div class="logo">🛒 在线商城</div>
        <div class="nav">
            <a href="/">首页</a>
            <a href="/cart">购物车</a>
            <a href="/orders">我的订单</a>
        </div>
        <div class="user-info" id="userInfo">
            <a href="/login" id="loginLink">登录</a>
            <a href="/register" id="registerLink">注册</a>
        </div>
    </div>
</div>
<div class="container">
    <div class="message" id="message"></div>
    <div class="page-title">📋 我的订单</div>
    <div class="order-list" id="orderList"></div>
    <div class="pagination" id="pagination"></div>
</div>
<div class="footer">
    <p>© 2024 在线商城 - 在线购物平台</p>
</div>
<script>
    let currentPage = 1;
    function showMessage(success, msg) {
        const el = document.getElementById('message');
        el.style.display = 'block';
        el.className = 'message ' + (success ? 'success' : 'error');
        el.textContent = msg;
        setTimeout(() => el.style.display = 'none', 3000);
    }
    function getStatusText(status) {
        const map = { 0: '待支付', 1: '已支付', 2: '已发货', 3: '已完成' };
        return map[status] || '未知';
    }
    function getStatusClass(status) {
        const map = { 0: 'pending', 1: 'paid', 2: 'shipped', 3: 'completed' };
        return map[status] || '';
    }
    function loadOrders(page) {
        currentPage = page;
        fetch('/web/order/page?pageNum=' + page + '&pageSize=10')
            .then(r => r.json())
            .then(data => {
                if (data.code !== 200) {
                    location.href = '/login';
                    return;
                }
                renderOrders(data.data.records);
                renderPagination(data.data.current, data.data.pages);
            });
    }
    function renderOrders(orders) {
        const container = document.getElementById('orderList');
        if (!orders || orders.length === 0) {
            container.innerHTML = '<div class="empty">暂无订单，<a href="/" style="color:#667eea;">去购物</a></div>';
            return;
        }
        let html = orders.map(order => `
            <div class="order-card">
                <div class="order-header">
                    <div class="order-no">订单号：${order.orderNo}</div>
                    <div class="order-status ${getStatusClass(order.status)}">${getStatusText(order.status)}</div>
                </div>
                <div class="order-items" id="items-${order.id}">加载中...</div>
                <div class="order-footer">
                    <div class="order-total">合计：<span>¥${order.totalAmount}</span></div>
                    ${order.status === 0 ? `<button class="order-btn" onclick="pay(${order.id})">立即支付</button>` : ''}
                    ${order.status === 2 ? `<button class="order-btn" onclick="complete(${order.id})">确认收货</button>` : ''}
                </div>
            </div>
        `).join('');
        container.innerHTML = html;
        orders.forEach(order => loadOrderItems(order.id));
    }
    function loadOrderItems(orderId) {
        fetch('/web/order/' + orderId + '/items')
            .then(r => r.json())
            .then(data => {
                if (data.code === 200) {
                    const items = data.data || [];
                    const container = document.getElementById('items-' + orderId);
                    if (container) {
                        container.innerHTML = items.map(item => `
                            <div class="order-item">
                                <div class="item-image">📦</div>
                                <div class="item-info">
                                    <div class="item-name">${item.productName}</div>
                                    <div class="item-price">¥${item.price} x ${item.quantity} = ¥${item.totalAmount}</div>
                                </div>
                            </div>
                        `).join('');
                    }
                }
            });
    }
    function renderPagination(current, total) {
        const container = document.getElementById('pagination');
        let html = '';
        for (let i = 1; i <= total; i++) {
            html += `<button class="${i === current ? 'active' : ''}" onclick="loadOrders(${i})">${i}</button>`;
        }
        container.innerHTML = html;
    }
    function pay(orderId) {
        fetch('/web/order/' + orderId + '/pay', { method: 'POST' })
            .then(r => r.json())
            .then(data => {
                if (data.code === 200) {
                    showMessage(true, '支付成功');
                    loadOrders(currentPage);
                } else {
                    showMessage(false, data.msg);
                }
            });
    }
    function complete(orderId) {
        fetch('/web/order/' + orderId + '/complete', { method: 'POST' })
            .then(r => r.json())
            .then(data => {
                if (data.code === 200) {
                    showMessage(true, '确认收货成功');
                    loadOrders(currentPage);
                } else {
                    showMessage(false, data.msg);
                }
            });
    }
    loadOrders(1);
    fetch('/web/user/session')
        .then(r => r.json())
        .then(data => {
            if (data.code === 200 && data.data) {
                document.getElementById('userInfo').innerHTML =
                    '<span>欢迎，' + data.data.nickname + '</span>' +
                    '<a href="/profile">个人中心</a>' +
                    '<button onclick="logout()">退出</button>';
                document.getElementById('loginLink').style.display = 'none';
                document.getElementById('registerLink').style.display = 'none';
            }
        });
    function logout() {
        fetch('/web/user/logout', { method: 'POST' })
            .then(() => location.href = '/');
    }
</script>
</body>
</html>
