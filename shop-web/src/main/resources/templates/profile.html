<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>个人中心 - 在线商城</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Microsoft YaHei', sans-serif; background: #f5f5f5; }
        .header { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 0 20px; }
        .header-inner { max-width: 1200px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; height: 60px; }
        .logo { font-size: 24px; font-weight: bold; }
        .nav { display: flex; gap: 30px; }
        .nav a { color: white; text-decoration: none; font-size: 16px; opacity: 0.9; }
        .nav a:hover { opacity: 1; }
        .user-info { display: flex; align-items: center; gap: 15px; }
        .user-info a { color: white; text-decoration: none; }
        .user-info button { padding: 6px 16px; background: rgba(255,255,255,0.2); border: none; color: white; border-radius: 4px; cursor: pointer; }
        .container { max-width: 800px; margin: 30px auto; padding: 0 20px; }
        .page-title { font-size: 24px; margin-bottom: 20px; color: #333; }
        .profile-card { background: white; border-radius: 8px; padding: 30px; }
        .avatar-section { text-align: center; margin-bottom: 30px; }
        .avatar { width: 120px; height: 120px; border-radius: 50%; background: #f0f0f0; display: flex; align-items: center; justify-content: center; font-size: 50px; margin: 0 auto 15px; }
        .avatar img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; color: #666; font-weight: 500; }
        .form-group input { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 6px; font-size: 14px; }
        .form-group input[readonly] { background: #f9f9f9; cursor: not-allowed; }
        .btn { padding: 12px 30px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 16px; }
        .btn:hover { opacity: 0.9; }
        .footer { background: #333; color: #999; text-align: center; padding: 30px 0; margin-top: 50px; }
        .message { position: fixed; top: 80px; left: 50%; transform: translateX(-50%); padding: 12px 24px; border-radius: 6px; display: none; z-index: 1000; }
        .message.success { background: #d4edda; color: #155724; }
        .message.error { background: #f8d7da; color: #721c24; }
        .upload-btn { padding: 8px 20px; background: #667eea; color: white; border: none; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>
<div class="header">
    <div class="header-inner">
        <div class="logo">🛒 在线商城</div>
        <div class="nav">
            <a href="/">首页</a>
            <a href="/cart">购物车</a>
            <a href="/orders">我的订单</a>
        </div>
        <div class="user-info" id="userInfo">
            <a href="/login" id="loginLink">登录</a>
            <a href="/register" id="registerLink">注册</a>
        </div>
    </div>
</div>
<div class="container">
    <div class="message" id="message"></div>
    <div class="page-title">👤 个人中心</div>
    <div class="profile-card">
        <div class="avatar-section">
            <div class="avatar" id="avatar">👤</div>
            <input type="file" id="avatarFile" accept="image/*" style="display: none;">
            <button class="upload-btn" onclick="document.getElementById('avatarFile').click()">更换头像</button>
        </div>
        <div class="form-group">
            <label>用户名</label>
            <input type="text" id="username" readonly>
        </div>
        <div class="form-group">
            <label>昵称</label>
            <input type="text" id="nickname" placeholder="请输入昵称">
        </div>
        <div class="form-group">
            <label>邮箱</label>
            <input type="email" id="email" placeholder="请输入邮箱">
        </div>
        <div class="form-group">
            <label>手机号</label>
            <input type="text" id="phone" placeholder="请输入手机号">
        </div>
        <button class="btn" onclick="saveProfile()">保存</button>
    </div>
</div>
<div class="footer">
    <p>© 2024 在线商城 - 在线购物平台</p>
</div>
<script>
    function showMessage(success, msg) {
        const el = document.getElementById('message');
        el.style.display = 'block';
        el.className = 'message ' + (success ? 'success' : 'error');
        el.textContent = msg;
        setTimeout(() => el.style.display = 'none', 3000);
    }
    function loadProfile() {
        fetch('/web/user/session')
            .then(r => r.json())
            .then(data => {
                if (data.code !== 200) {
                    location.href = '/login';
                    return;
                }
                const user = data.data;
                document.getElementById('username').value = user.username || '';
                document.getElementById('nickname').value = user.nickname || '';
                document.getElementById('email').value = user.email || '';
                document.getElementById('phone').value = user.phone || '';
                if (user.avatar) {
                    document.getElementById('avatar').innerHTML = '<img src="' + user.avatar + '">';
                }
            });
    }
    function saveProfile() {
        fetch('/web/user/profile', {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                nickname: document.getElementById('nickname').value,
                email: document.getElementById('email').value,
                phone: document.getElementById('phone').value
            })
        })
        .then(r => r.json())
        .then(data => {
            if (data.code === 200) {
                showMessage(true, '保存成功');
            } else {
                showMessage(false, data.msg);
            }
        });
    }
    document.getElementById('avatarFile').addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (!file) return;
        const formData = new FormData();
        formData.append('file', file);
        fetch('/web/file/upload', { method: 'POST', body: formData })
            .then(r => r.json())
            .then(data => {
                if (data.code === 200 && data.data) {
                    fetch('/web/user/avatar', {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ avatarUrl: data.data.url })
                    })
                    .then(r => r.json())
                    .then(d => {
                        if (d.code === 200) {
                            showMessage(true, '头像更新成功');
                            loadProfile();
                        } else {
                            showMessage(false, d.msg);
                        }
                    });
                } else {
                    showMessage(false, data.msg);
                }
            });
    });
    loadProfile();
    fetch('/web/user/session')
        .then(r => r.json())
        .then(data => {
            if (data.code === 200 && data.data) {
                document.getElementById('userInfo').innerHTML =
                    '<span>欢迎，' + data.data.nickname + '</span>' +
                    '<a href="/profile">个人中心</a>' +
                    '<button onclick="logout()">退出</button>';
                document.getElementById('loginLink').style.display = 'none';
                document.getElementById('registerLink').style.display = 'none';
            }
        });
    function logout() {
        fetch('/web/user/logout', { method: 'POST' })
            .then(() => location.href = '/');
    }
</script>
</body>
</html>
