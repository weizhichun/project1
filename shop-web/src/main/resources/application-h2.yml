spring:
  application:
    name: shop-web
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:file:./shopdb;MODE=MySQL;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
    username: sa
    password: 
  sql:
    init:
      mode: always
  h2:
    console:
      enabled: true
      path: /h2-console
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 20MB
  thymeleaf:
    cache: false
    prefix: classpath:/templates/
    suffix: .html
    encoding: UTF-8
    mode: HTML
mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: isDeleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# 自定义文件上传配置
file:
  upload:
    base-path: uploads/
    url-prefix: /uploads/
    max-file-size: 10485760  # 10MB（字节）
