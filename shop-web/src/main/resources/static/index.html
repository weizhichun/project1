<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>在线商城</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            background: #f5f5f5;
        }
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 0 20px;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .header-inner {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 60px;
        }
        .logo {
            font-size: 24px;
            font-weight: bold;
            cursor: pointer;
        }
        .nav {
            display: flex;
            gap: 30px;
        }
        .nav a {
            color: white;
            text-decoration: none;
            font-size: 16px;
            opacity: 0.9;
            cursor: pointer;
        }
        .nav a:hover {
            opacity: 1;
        }
        .user-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .user-info a, .user-info span {
            color: white;
            text-decoration: none;
            cursor: pointer;
        }
        .user-info button {
            padding: 6px 16px;
            background: rgba(255,255,255,0.2);
            border: none;
            color: white;
            border-radius: 4px;
            cursor: pointer;
        }
        .container {
            max-width: 1200px;
            margin: 30px auto;
            padding: 0 20px;
        }
        .product-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }
        .product-card {
            background: white;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            transition: transform 0.3s;
        }
        .product-card:hover {
            transform: translateY(-5px);
        }
        .product-image {
            height: 200px;
            background: #f0f0f0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 60px;
        }
        .product-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .product-info {
            padding: 15px;
        }
        .product-name {
            font-size: 16px;
            color: #333;
            margin-bottom: 10px;
            font-weight: 500;
        }
        .product-price {
            font-size: 20px;
            color: #e74c3c;
            font-weight: bold;
            margin-bottom: 10px;
        }
        .product-stock {
            color: #999;
            font-size: 12px;
            margin-bottom: 10px;
        }
        .product-btn {
            width: 100%;
            padding: 10px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        .product-btn:hover {
            opacity: 0.9;
        }
        .footer {
            background: #333;
            color: #999;
            text-align: center;
            padding: 30px 0;
            margin-top: 50px;
        }
        .load-more {
            text-align: center;
            margin-top: 30px;
        }
        .load-more-btn {
            padding: 12px 40px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            transition: transform 0.2s;
        }
        .load-more-btn:hover {
            transform: translateY(-2px);
        }
        .load-more-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }
        .message {
            position: fixed;
            top: 80px;
            left: 50%;
            transform: translateX(-50%);
            padding: 12px 24px;
            border-radius: 6px;
            display: none;
            z-index: 1000;
        }
        .message.success {
            background: #d4edda;
            color: #155724;
        }
        .message.error {
            background: #f8d7da;
            color: #721c24;
        }
        .login-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            z-index: 200;
            align-items: center;
            justify-content: center;
        }
        .login-modal.show {
            display: flex;
        }
        .login-box {
            background: white;
            padding: 40px;
            border-radius: 10px;
            width: 400px;
        }
        .login-box h2 {
            text-align: center;
            margin-bottom: 30px;
            color: #333;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #555;
        }
        .form-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
        }
        .form-group input:focus {
            outline: none;
            border-color: #667eea;
        }
        .login-btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            margin-bottom: 10px;
        }
        .close-btn {
            width: 100%;
            padding: 12px;
            background: #999;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }
        .loading {
            text-align: center;
            padding: 50px;
            color: #999;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-inner">
            <div class="logo" onclick="location.reload()">🛒 在线商城</div>
            <div class="nav">
                <a onclick="location.reload()">首页</a>
                <a href="/api-test.html" target="_blank">API测试</a>
                <a href="/ajax-upload.html" target="_blank">文件上传</a>
            </div>
            <div class="user-info" id="userInfo">
                <a onclick="showLoginModal()">登录</a>
                <a>注册</a>
            </div>
        </div>
    </div>

    <div class="container">
        <div class="message" id="message"></div>
        <div class="product-list" id="productList">
            <div class="loading">加载中...</div>
        </div>
        <div class="load-more" id="loadMore">
            <button class="load-more-btn" id="loadMoreBtn" onclick="loadMore()">加载更多</button>
        </div>
    </div>

    <div class="login-modal" id="loginModal">
        <div class="login-box">
            <h2>用户登录</h2>
            <div class="form-group">
                <label for="modalUsername">用户名</label>
                <input type="text" id="modalUsername" placeholder="请输入用户名">
            </div>
            <div class="form-group">
                <label for="modalPassword">密码</label>
                <input type="password" id="modalPassword" placeholder="请输入密码">
            </div>
            <button class="login-btn" onclick="doLogin()">登录</button>
            <button class="close-btn" onclick="closeLoginModal()">关闭</button>
        </div>
    </div>

    <div class="footer">
        <p>© 2024 在线商城 - 在线购物平台</p>
    </div>

    <script>
        let currentPage = 1;
        let hasNext = true;
        let allProducts = [];
        let currentUser = null;

        function showMessage(success, msg) {
            const el = document.getElementById('message');
            el.style.display = 'block';
            el.className = 'message ' + (success ? 'success' : 'error');
            el.textContent = msg;
            setTimeout(() => el.style.display = 'none', 3000);
        }

        function loadProducts() {
            fetch('/api/product/list?page=' + currentPage + '&size=6')
                .then(r => {
                    if (!r.ok) throw new Error('网络错误');
                    return r.json();
                })
                .then(data => {
                    console.log('商品数据:', data);
                    if (data.code === 200) {
                        hasNext = data.data.hasNext;
                        if (currentPage === 1) {
                            allProducts = data.data.list;
                            renderProducts(allProducts);
                        } else {
                            allProducts = allProducts.concat(data.data.list);
                            renderProducts(allProducts);
                        }
                        updateLoadMoreBtn();
                    } else {
                        showMessage(false, data.msg || '加载失败');
                    }
                })
                .catch(err => {
                    console.error('加载错误:', err);
                    showMessage(false, '加载商品失败: ' + err.message);
                    document.getElementById('productList').innerHTML = 
                        '<div class="loading">加载失败，请稍后重试</div>';
                });
        }

        function renderProducts(products) {
            const container = document.getElementById('productList');
            if (!products || products.length === 0) {
                container.innerHTML = '<div class="loading">暂无商品</div>';
                return;
            }
            container.innerHTML = products.map(p => `
                <div class="product-card">
                    <div class="product-image">
                        ${p.mainImage ? '<img src="' + p.mainImage + '" alt="' + p.productName + '">' : '📦'}
                    </div>
                    <div class="product-info">
                        <div class="product-name">${p.productName}</div>
                        <div class="product-price">¥${p.price}</div>
                        <div class="product-stock">库存: ${p.stock} | 状态: ${p.status === 1 ? '上架' : '下架'}</div>
                        <button class="product-btn" onclick="addToCart(${p.id})">加入购物车</button>
                    </div>
                </div>
            `).join('');
        }

        function loadMore() {
            if (!hasNext) return;
            currentPage++;
            loadProducts();
        }

        function updateLoadMoreBtn() {
            const btn = document.getElementById('loadMoreBtn');
            if (!hasNext) {
                btn.textContent = '没有更多了';
                btn.disabled = true;
            } else {
                btn.textContent = '加载更多';
                btn.disabled = false;
            }
        }

        function addToCart(productId) {
            if (!currentUser) {
                showLoginModal();
                return;
            }
            showMessage(true, '加入购物车成功！');
        }

        function showLoginModal() {
            document.getElementById('loginModal').classList.add('show');
        }

        function closeLoginModal() {
            document.getElementById('loginModal').classList.remove('show');
        }

        function doLogin() {
            const username = document.getElementById('modalUsername').value;
            const password = document.getElementById('modalPassword').value;

            if (!username || !password) {
                showMessage(false, '请输入用户名和密码');
                return;
            }

            fetch('/api/user/login', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ username, password })
            })
                .then(r => r.json())
                .then(data => {
                    if (data.code === 200) {
                        currentUser = data.data;
                        closeLoginModal();
                        updateUserNav();
                        showMessage(true, '登录成功！欢迎 ' + currentUser.nickname);
                    } else {
                        showMessage(false, data.msg || '登录失败');
                    }
                })
                .catch(err => {
                    showMessage(false, '登录失败: ' + err.message);
                });
        }

        function doLogout() {
            fetch('/api/user/logout', {
                method: 'POST'
            })
                .then(() => {
                    currentUser = null;
                    updateUserNav();
                    showMessage(true, '退出成功');
                });
        }

        function updateUserNav() {
            const userInfo = document.getElementById('userInfo');
            if (currentUser) {
                userInfo.innerHTML = `
                    <span>欢迎, ${currentUser.nickname}</span>
                    <button onclick="doLogout()">退出</button>
                `;
            } else {
                userInfo.innerHTML = `
                    <a onclick="showLoginModal()">登录</a>
                    <a>注册</a>
                `;
            }
        }

        function checkLogin() {
            fetch('/api/user/current')
                .then(r => r.json())
                .then(data => {
                    if (data.code === 200 && data.data) {
                        currentUser = data.data;
                        updateUserNav();
                    }
                })
                .catch(() => {});
        }

        document.getElementById('loginModal').addEventListener('click', (e) => {
            if (e.target.id === 'loginModal') {
                closeLoginModal();
            }
        });

        loadProducts();
        checkLogin();
    </script>
</body>
</html>
